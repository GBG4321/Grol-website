<script>
  // Lock viewport height to actual visible pixels — fixes Instagram/TikTok/Facebook
  // in-app browsers that lie about 100vh / 100svh on initial load.
  (function () {
    var setVh = function () {
      document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
      // Some in-app browsers (Instagram/TikTok/Facebook) briefly report a
      // desktop-sized layout viewport before correcting to the real mobile
      // width a moment after load. Anything keyed off the `md:` breakpoint
      // reads that stale width and applies desktop-only layout (like the
      // negative margin that intentionally overlaps Hero and Services on
      // real desktops), producing a text pile-up on phones. Mirror the same
      // measure to a CSS var, defaulting to "not desktop" until confirmed.
      document.documentElement.style.setProperty('--app-desktop', window.innerWidth >= 768 ? '1' : '0');
    };
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', setVh);
    // Re-measure once after first paint settles — catches in-app browsers
    // that finish their toolbar layout slightly after load.
    window.addEventListener('load', function () {
      setTimeout(setVh, 50);
      setTimeout(setVh, 250);
      setTimeout(setVh, 600);
    });
  })();
</script>

<style>
  :root {
    --background: 0 0% 0%;
    --foreground: 0 0% 100%;
    --muted-foreground: 0 0% 65%;
    --hero-subtitle: 210 17% 95%;
  }

  html { scroll-behavior: smooth; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .text-muted-foreground { color: hsl(var(--muted-foreground)); }
  .bg-foreground { background-color: hsl(var(--foreground)); }
  .text-background { color: hsl(var(--background)); }

  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .nav-divider { box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06); }

  /* Nav dropdown */
  .nav-item { position: relative; }
  .nav-dd { position: absolute; left: 50%; top: 100%; padding-top: 16px; transform: translateX(-50%) translateY(6px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22,1,0.36,1); z-index: 60; }
  .nav-item:hover .nav-dd, .nav-item:focus-within .nav-dd { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .nav-dd-panel { width: 340px; border-radius: 16px; padding: 8px; background: rgba(12,12,12,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 60px -20px rgba(0,0,0,0.8); }
  .nav-dd-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border-radius: 11px; transition: background 0.18s ease; text-decoration: none; color: #fff; }
  .nav-dd-item:hover { background: rgba(255,255,255,0.06); }
  .nav-dd-num { font-family: 'Instrument Serif', ui-serif, Georgia, serif; font-style: italic; font-size: 18px; line-height: 1; color: rgba(255,255,255,0.5); padding-top: 2px; flex: none; width: 22px; }
  .nav-dd-title { font-size: 14px; font-weight: 500; line-height: 1.2; display: block; }
  .nav-dd-sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px; line-height: 1.3; display: block; }

  /* Learn more link */
  .learn-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; color: #fff; text-decoration: none; width: fit-content; }
  .learn-link .lm-arrow { transition: transform 0.24s cubic-bezier(0.22,1,0.36,1); }
  .learn-link:hover .lm-arrow { transform: translateX(4px); }
  .learn-link .lm-underline { background-image: linear-gradient(currentColor, currentColor); background-size: 0% 1px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 2px; transition: background-size 0.28s cubic-bezier(0.22,1,0.36,1); }
  .learn-link:hover .lm-underline { background-size: 100% 1px; }

  /* Rotating shiny border light */
  @property --pill-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  .pill-glow { position: relative; }
  .pill-glow::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: conic-gradient(
      from var(--pill-angle),
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0) 270deg,
      rgba(255,255,255,0.85) 335deg,
      rgba(255,255,255,1) 350deg,
      rgba(255,255,255,0.85) 360deg
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.45));
    animation: pillGlowSpin 6.5s linear infinite;
  }
  @keyframes pillGlowSpin {
    to { --pill-angle: 360deg; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill-glow::after { animation: none; }
  }

  /* Founder frame hover tilt */
  .tilt-hover {
    transform: perspective(900px) rotateX(0deg) rotateY(0deg);
    transition: transform 600ms cubic-bezier(0.22,1,0.36,1), box-shadow 600ms cubic-bezier(0.22,1,0.36,1);
    will-change: transform;
  }
  .tilt-hover:hover {
    transform: perspective(900px) rotateX(4deg) rotateY(-7deg) scale(1.015);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  @media (prefers-reduced-motion: reduce) {
    .tilt-hover, .tilt-hover:hover { transform: none; }
  }

  /* Strikethrough → reveal on "honest" */
  .strike-word {
    position: relative;
    display: inline-block;
    color: rgba(255,255,255,0.55);
    opacity: 0;
    font-weight: inherit;
    margin-right: 0.18em;
  }
  .reveal.is-in .strike-word {
    animation: strikeWordIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.25s forwards;
  }
  .strike-word::after {
    content: '';
    position: absolute;
    top: 56%;
    left: -3%;
    width: 0;
    height: 2px;
    background: rgba(255,255,255,0.75);
    border-radius: 2px;
    transform: rotate(-2deg);
    transform-origin: 0 50%;
  }
  .reveal.is-in .strike-word::after {
    animation: strikeDraw 0.45s cubic-bezier(0.65,0,0.35,1) 0.85s forwards;
  }
  .honest-word {
    display: inline-block;
    opacity: 0;
  }
  .reveal.is-in .honest-word {
    animation: honestIn 0.7s cubic-bezier(0.22,1,0.36,1) 1.4s forwards;
  }
  @keyframes strikeWordIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes strikeDraw {
    to { width: 106%; }
  }
  @keyframes honestIn {
    from { opacity: 0; transform: translateY(8px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal.is-in .strike-word,
    .reveal.is-in .strike-word::after,
    .reveal.is-in .honest-word {
      animation: none;
      opacity: 1;
      transform: none;
    }
    .reveal.is-in .strike-word::after { width: 106%; }
  }

  /* Entrance animations */
  @keyframes fadeUpSm {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .anim-pill     { opacity: 0; animation: fadeUpSm 0.5s cubic-bezier(0.22,1,0.36,1) 0s    forwards; }
  .anim-title    { opacity: 0; animation: fadeUp   0.6s cubic-bezier(0.22,1,0.36,1) 0.1s  forwards; }
  .anim-subtitle { opacity: 0; animation: fadeUp   0.6s cubic-bezier(0.22,1,0.36,1) 0.2s  forwards; }
  .anim-cta      { opacity: 0; animation: fadeUp   0.6s cubic-bezier(0.22,1,0.36,1) 0.3s  forwards; }
  .anim-meta     { opacity: 0; animation: fadeIn   0.8s cubic-bezier(0.22,1,0.36,1) 0.7s  forwards; }

  /* Hover spring-feel */
  .btn-press { transition: transform 220ms cubic-bezier(0.22,1,0.36,1); }
  .btn-press:hover  { transform: scale(1.03); }
  .btn-press:active { transform: scale(0.98); }

  /* Morphing letter — "l" ⇄ "w" */
  .morph-letter {
    display: inline-grid;
    vertical-align: baseline;
    line-height: inherit;
    justify-items: start;
  }
  .morph-letter > span {
    grid-area: 1 / 1;
    will-change: opacity, transform, filter;
    display: inline-block;
    transform-origin: 50% 100%;
  }
  .morph-letter > .ml-l {
    animation: morph-l 5.5s ease-in-out infinite;
  }
  .morph-letter > .ml-w {
    animation: morph-w 5.5s ease-in-out infinite;
  }
  @keyframes morph-l {
    0%, 30%, 100% { opacity: 0; transform: scale(0.92); filter: blur(0.4px); }
    50%, 80%      { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes morph-w {
    0%, 30%, 100% { opacity: 1; transform: scale(1); filter: blur(0); }
    50%, 80%      { opacity: 0; transform: scale(0.92); filter: blur(0.4px); }
  }

  /* Services section */
  .svc-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, rgba(255,255,255,0.01) 100%);
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 280ms cubic-bezier(0.22,1,0.36,1),
                background 280ms cubic-bezier(0.22,1,0.36,1),
                transform 280ms cubic-bezier(0.22,1,0.36,1);
  }
  .svc-card:hover {
    border-color: rgba(255,255,255,0.22);

  }
  .svc-num {
    font-family: 'Instrument Serif', ui-serif, Georgia, serif;

  }
  .svc-divider { height: 1px; background: rgba(255,255,255,0.08); }
  .svc-bullet  { width: 4px; height: 4px; border-radius: 9999px; background: rgba(255,255,255,0.45); flex: none; }

  /* Comparison table */
  .cmp-wrap { border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0.006)); }
  .cmp-grid { grid-template-columns: 1fr; }
  .cmp-row { border-top: 1px solid rgba(255,255,255,0.07); }
  .cmp-h { padding: 16px 22px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55); display: flex; align-items: center; gap: 9px; font-weight: 500; }
  .cmp-h--grol { color: #fff; font-weight: 600; }
  .cmp-h--other { color: rgba(255,255,255,0.5); }
  .cmp-col-grol { background: rgba(255,255,255,0.04); box-shadow: inset 1px 0 0 rgba(255,255,255,0.07), inset -1px 0 0 rgba(255,255,255,0.07); }
  .cmp-label { padding: 18px 22px 6px; font-weight: 600; font-size: 12.5px; letter-spacing: 0.06em; color: rgba(255,255,255,0.9); text-transform: uppercase; }
  .cmp-cell { padding: 12px 22px 18px; font-size: 14.5px; line-height: 1.5; display: flex; flex-direction: column; }
  .cmp-cell--grol { color: rgba(255,255,255,0.9); }
  .cmp-cell--other { color: rgba(255,255,255,0.5); }
  .cmp-pt { display: flex; gap: 11px; align-items: flex-start; }
  .cmp-ico { flex: none; margin-top: 2px; }
  .cmp-cell--grol .cmp-ico { color: #fff; }
  .cmp-cell--other .cmp-ico { color: rgba(255,255,255,0.35); }
  .cmp-mini { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(255,255,255,0.42); margin-bottom: 9px; }
  @media (min-width: 768px) {
    .cmp-grid { grid-template-columns: 1.05fr 1.45fr 1.35fr; }
    .cmp-label { padding: 22px; font-size: 15px; font-weight: 500; letter-spacing: -0.2px; color: #fff; text-transform: none; display: flex; align-items: center; }
    .cmp-cell { padding: 22px; }
  }

  /* Pricing */
  .price-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, rgba(255,255,255,0.008) 100%);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 22px;
    transition: border-color 280ms cubic-bezier(0.22,1,0.36,1), transform 280ms cubic-bezier(0.22,1,0.36,1), box-shadow 280ms cubic-bezier(0.22,1,0.36,1);
  }
  .price-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-3px); }
  .price-card--featured {
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 30px 70px -32px rgba(255,255,255,0.22);
    background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.012) 100%);
  }
  .price-card--featured:hover { border-color: rgba(255,255,255,0.7); }
  .price-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #000; background: #fff; padding: 5px 11px; border-radius: 9999px;
  }
  .price-kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .price-amount { font-size: 2.75rem; font-weight: 500; letter-spacing: -1.5px; line-height: 1; }
  .price-unit { font-size: 13.5px; color: rgba(255,255,255,0.55); }
  .price-divider { height: 1px; background: rgba(255,255,255,0.09); }
  .price-inherit { font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 500; }
  .price-li { display: flex; gap: 11px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.85); }
  .price-li .pl-ico { flex: none; margin-top: 2px; color: #fff; }
  .price-note {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.03);
    border-radius: 14px; padding: 16px 16px;
    font-size: 13px; line-height: 1.55; color: rgba(255,255,255,0.72);
  }
  .price-note b { color: #fff; font-weight: 600; }

    width: 100%; text-align: center; border-radius: 9999px; padding: 13px 20px;
    font-size: 15px; font-weight: 500; transition: transform 220ms cubic-bezier(0.22,1,0.36,1), background 200ms, border-color 200ms;

function ParticleField() {
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf;
    let particles = [];
    const dpr = Math.max(1, window.devicePixelRatio || 1);

    const resize = () => {
      const { innerWidth: w, innerHeight: h } = window;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const seed = () => {
      const { innerWidth: w, innerHeight: h } = window;
      const count = w < 640 ? 60 : 100;
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.6 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 0.85,
        vy: (Math.random() - 0.5) * 0.85,
        a: 0.3 + Math.random() * 0.4
      }));
    };

    const tick = () => {
      const { innerWidth: w, innerHeight: h } = window;
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -5) p.x = w + 5;
        if (p.x > w + 5) p.x = -5;
        if (p.y < -5) p.y = h + 5;
        if (p.y > h + 5) p.y = -5;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,' + (p.a * 0.55) + ')';
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };

    resize();
    seed();
    tick();

    const onResize = () => { resize(); };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="absolute inset-0 z-0 block w-full h-full pointer-events-none"
      aria-hidden="true" />);


}

function ParticleFieldLocal({ density = 60, opacity = [0.2, 0.5] }) {
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const parent = canvas.parentElement;
    const ctx = canvas.getContext('2d');
    let raf;
    let particles = [];
    const dpr = Math.max(1, window.devicePixelRatio || 1);

    const size = () => {
      const r = parent.getBoundingClientRect();
      return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
    };

    const resize = () => {
      const { w, h } = size();
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const seed = () => {
      const { w, h } = size();
      const count = w < 640 ? Math.round(density * 0.6) : density;
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.6 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 0.75,
        vy: (Math.random() - 0.5) * 0.75,
        a: opacity[0] + Math.random() * (opacity[1] - opacity[0])
      }));
    };

    const tick = () => {
      const { w, h } = size();
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -5) p.x = w + 5;
        if (p.x > w + 5) p.x = -5;
        if (p.y < -5) p.y = h + 5;
        if (p.y > h + 5) p.y = -5;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,' + (p.a * 0.55) + ')';
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };

    resize();
    seed();
    tick();

    const ro = new ResizeObserver(() => { resize(); });
    ro.observe(parent);
    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
    };
  }, [density]);

  return (
    <canvas
      ref={canvasRef}
      className="absolute inset-0 z-0 block w-full h-full pointer-events-none"
      aria-hidden="true" />);

}

function CalendlyModal() {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);
  const initRef = React.useRef(false);

  React.useEffect(() => {
    const onOpen = () => setOpen(true);
    window.addEventListener('open-calendly', onOpen);
    return () => window.removeEventListener('open-calendly', onOpen);
  }, []);

  React.useEffect(() => {
    if (open) {
      document.body.style.overflow = 'hidden';
      const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
      window.addEventListener('keydown', onKey);
      return () => {
        document.body.style.overflow = '';
        window.removeEventListener('keydown', onKey);
      };
    }
  }, [open]);

  React.useEffect(() => {
    if (!open) { initRef.current = false; return; }
    if (initRef.current) return;
    const tryInit = () => {
      if (window.Calendly && wrapRef.current) {
        wrapRef.current.innerHTML = '';
        window.Calendly.initInlineWidget({
          url: 'https://calendly.com/grolmedia-agency/30min?hide_event_type_details=0&hide_gdpr_banner=1&background_color=0a0a0a&text_color=ffffff&primary_color=ffffff',
          parentElement: wrapRef.current
        });
        initRef.current = true;
      } else {
        setTimeout(tryInit, 120);
      }
    };
    tryInit();
  }, [open]);

  if (!open) return null;
  return (
    <div
      className="fixed inset-0 z-[100] flex items-center justify-center px-3 sm:px-6 py-6 sm:py-10"
      style={{ background: 'rgba(0,0,0,0.78)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)' }}
      onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }}>
      
      <div className="relative w-full max-w-[1080px] h-[88vh] sm:h-[86vh] rounded-2xl overflow-hidden border border-white/10 bg-[#0a0a0a] shadow-2xl">
        <button
          onClick={() => setOpen(false)}
          aria-label="Close"
          className="absolute top-3 right-3 z-10 w-9 h-9 rounded-full inline-flex items-center justify-center border border-white/15 bg-black/50 hover:bg-white/10 hover:border-white/40 transition-colors text-white/85">
          
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
          </svg>
        </button>
        <div ref={wrapRef} className="calendly-inline-widget w-full h-full" style={{ minWidth: 0 }}></div>
      </div>
    </div>);

}

(function revealApp() {
  var root = document.getElementById('root');
  function reveal() { root.classList.add('app-ready'); }
  // Wait two frames after mount so Tailwind's injected stylesheet and the
  // browser's layout pass have both been applied before we show anything.
  requestAnimationFrame(function () { requestAnimationFrame(reveal); });
  // Safety net - never leave the page blank if something above stalls.
  setTimeout(reveal, 1500);
})();
